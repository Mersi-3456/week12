
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seleniumdemo-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seleniumdemo
  template:
    metadata:
      labels:
        app: seleniumdemo
    spec:
      containers:
        - name: seleniumdemo
          image: seleniumdemo:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 5001
